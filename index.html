<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Детектив текста — DerekSci</title>
  <meta name="description" content="Образовательная игра DerekSci «Детектив текста»: читательская грамотность в коротких игровых уроках.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<!--
  class="standalone" — только для автономного запуска: резервирует слева 232px под боковое меню
  платформы-хоста и показывает пунктирную заглушку. При встраивании в платформу класс убрать —
  #ds-app займёт контентную область хоста, а фиксированные элементы (панель урока, модалки, тосты)
  сместятся на --ds-host-sidebar (см. css/styles.css).
-->
<body class="standalone">
  <div class="host-stub" aria-hidden="true"><span>Меню платформы<br>232px</span></div>

  <div id="ds-app" class="ds-app">
    <div id="offline-banner" class="offline-banner" role="status" hidden>Нет подключения к интернету. Ответы отправятся, когда связь восстановится.</div>

    <header class="topbar">
      <a class="brand" href="#/home" aria-label="Детектив текста — на главную">
        <span class="brand-logo" aria-hidden="true">D</span>
        <span class="brand-text"><b>Детектив текста</b><small>DerekSci</small></span>
      </a>
      <nav id="nav" class="topnav" aria-label="Разделы игры"></nav>
      <div class="topbar-right">
        <div class="stats" data-stats></div>
        <div id="topbar-user"></div>
      </div>
    </header>

    <main id="main" class="main" tabindex="-1"></main>

    <div id="modal-root" hidden></div>
    <div id="toast-root" class="toasts" aria-live="polite"></div>
    <div id="sr-live" class="sr-only" aria-live="assertive"></div>
  </div>

  <noscript>Для игры нужен включённый JavaScript.</noscript>

  <!-- Иконки: Lucide v1.72.0 (ISC), локальная копия -->
  <script src="vendor/lucide.min.js"></script>

  <!-- Мок-бэкенд (заменяется на Laravel API: DS.api.config.USE_MOCK = false) -->
  <script src="js/mock/data.js"></script>
  <script src="js/mock/server.js"></script>
  <!-- Клиент -->
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/app.js"></script>
  <script src="js/views/auth.js"></script>
  <script src="js/views/main.js"></script>
  <script src="js/views/lesson.js"></script>
  <script src="js/views/profile.js"></script>
  <script src="js/views/cms.js"></script>
</body>
</html>
